services:  
  9router:  
    image: decolua/9router:latest  
    container_name: 9router  
    restart: always  
    ports:  
      - "20128:20128"  
    volumes:  
      - 9router-data:/app/data  
    environment:  
      DATA_DIR: /app/data  
      PORT: "20128"  
      HOSTNAME: "0.0.0.0"  
      NODE_ENV: production  
      # 其余密钥变量...  
  
volumes:  
  9router-data:  
    name: 9router-data
